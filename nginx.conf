worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ──────────────────────────────────────────────────────────
        # Auth routes → YARP Gateway (port 7000)
        # Frontend → Nginx → YARP Gateway (port 7000) → Web BFF
        # ──────────────────────────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://89.116.20.215:7000/web/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ──────────────────────────────────────────────────────────
        # SignalR hub → Chat API (port 7510) — WebSocket support
        # ──────────────────────────────────────────────────────────
        location /chathub {
            proxy_pass http://89.116.20.215:7510;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ──────────────────────────────────────────────────────────
        # All other API routes → Chat API (port 7510)
        # /api/Users/*, /api/Conversations/*, /api/Messages/*
        # ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://89.116.20.215:7510;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ──────────────────────────────────────────────────────────
        # SPA fallback — serve React app for all other routes
        # ──────────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
