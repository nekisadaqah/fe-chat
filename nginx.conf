worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ──────────────────────────────────────────────────────────
        # YARP Gateway Web BFF REST route (/web/*)
        # Frontend → Nginx → YARP Gateway /web/* → Web BFF
        # ──────────────────────────────────────────────────────────
        # Use the YARP Gateway DNS for the upstream route.
        location /web/ {
            proxy_pass https://api.nekkam.com:7000/web/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ──────────────────────────────────────────────────────────
        # YARP Gateway SignalR hub route (/chathub) — WebSocket support
        # Frontend → Nginx → YARP Gateway /chathub → be-chat ChatHub
        # ──────────────────────────────────────────────────────────
        location /chathub {
            proxy_pass https://api.nekkam.com:7000/chathub;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ──────────────────────────────────────────────────────────
        # SPA fallback — serve React app for all frontend routes
        # ──────────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

